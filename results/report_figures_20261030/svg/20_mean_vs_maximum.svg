   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #344254" x="52.7868" y="40.576875" transform="rotate(-0 52.7868 40.576875)">Selected configurations: mean versus observed maximum</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596776" x="52.7868" y="64.678359" transform="rotate(-0 52.7868 64.678359)">A high single run and the mean of its configuration are different quantities.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667485" x="52.7868" y="9.89375" transform="rotate(-0 52.7868 9.89375)">20  |  EXPLORATION / SELECTION BIAS</text>
  </g>
  <g id="text_26">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 506.232969)">Historical winning configurations were selected using probe scores across configurations and splits. Their means are also post-selection</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 517.707969)">summaries. Different dimensions, inputs and split counts prevent a common-protocol ranking; maxima are not stable test estimates.</text>
  </g>
