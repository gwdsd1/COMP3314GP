  <g id="text_19">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #344254" x="52.7868" y="40.576875" transform="rotate(-0 52.7868 40.576875)">MNIST: both gallery sizes, both representations</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596776" x="52.7868" y="64.678359" transform="rotate(-0 52.7868 64.678359)">Diamonds: paper values. Circles: our means. Horizontal whiskers: sample SD.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667485" x="52.7868" y="9.89375" transform="rotate(-0 52.7868 9.89375)">03  |  MAIN RESULT</text>
  </g>
  <g id="text_22">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 494.757969)">ORL* is the current HOSVD/context extension at 24-&gt;23 dimensions, not a common input with every other ORL row. MNIST uses the original three-seed</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 506.232969)">references. Best paper configurations and our repeated means have different reporting conventions. Paper values: Xu et al., IEEE TCSVT (2008),</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 518.097773)">Tables I/II/IV, doi:10.1109/TCSVT.2007.903317.</text>
  </g>
 </g>
