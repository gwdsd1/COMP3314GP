  <g id="text_28">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 494.757969)">These are fixed shared-cosine controls, not validation-selected winners. One fixed identity partition per q; no repeated-identity SD or</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 506.232969)">significance claim. CSA does not beat the reproduced PCA at q=50. Paper values: Xu et al., IEEE TCSVT (2008), Tables I/II/IV,</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #4b5866" transform="translate(52.7868 518.197383)">doi:10.1109/TCSVT.2007.903317.</text>
  </g>
